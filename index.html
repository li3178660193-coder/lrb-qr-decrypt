<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>LRB 商品信息解密</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f5f7;color:#202124;font-family:Arial,"Microsoft YaHei",sans-serif}
    main{max-width:460px;margin:8vh auto;padding:24px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:26px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
    h1{font-size:22px;margin:0 0 8px}
    p{color:#666;line-height:1.6;font-size:14px}
    input{width:100%;padding:14px;border:1px solid #ccd0d5;border-radius:10px;font-size:16px;margin:12px 0}
    button{width:100%;border:0;border-radius:10px;padding:14px;background:#171717;color:#fff;font-size:16px;cursor:pointer}
    #result{display:none;margin-top:18px;padding:14px;border-radius:10px;background:#f2f4f7;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
    #error{color:#b42318;min-height:22px;font-size:14px}
    .small{font-size:12px;color:#888;margin-top:18px}
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>LRB 商品信息验证</h1>
    <p>请输入商品随附的查询密码，验证通过后即可查看二维码原始内容。</p>
    <form id="form">
      <input id="password" type="password" autocomplete="current-password" placeholder="请输入查询密码" required>
      <button type="submit">验证并查看</button>
    </form>
    <div id="error" role="alert"></div>
    <div id="result"></div>
    <div class="small">加密内容在当前设备浏览器本地解密，密码不会发送到网站服务器。</div>
  </section>
</main>
<script>
"use strict";
const errorBox = document.getElementById("error");
const resultBox = document.getElementById("result");
const form = document.getElementById("form");

function parsePayload() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : "";
  const p = new URLSearchParams(raw);
  if (p.get("v") !== "1") throw new Error("二维码内容无效或版本不受支持。");
  const iterations = Number(p.get("i"));
  if (!Number.isInteger(iterations) || iterations < 100000 || iterations > 1000000) {
    throw new Error("加密参数无效。");
  }
  const s = p.get("s"), n = p.get("n"), c = p.get("c");
  if (!s || !n || !c) throw new Error("二维码数据不完整。");
  return {salt: fromB64url(s), nonce: fromB64url(n), ciphertext: fromB64url(c), iterations};
}

function fromB64url(value) {
  let b64 = value.replace(/-/g, "+").replace(/_/g, "/");
  b64 += "=".repeat((4 - b64.length % 4) % 4);
  const binary = atob(b64);
  return Uint8Array.from(binary, ch => ch.charCodeAt(0));
}

async function decrypt(payload, password) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:payload.salt, iterations:payload.iterations, hash:"SHA-256"},
    material, {name:"AES-GCM", length:256}, false, ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:payload.nonce}, key, payload.ciphertext
  );
  return new TextDecoder().decode(plain);
}

let payload = null;
try {
  if (!location.hash) throw new Error("请通过商品上的加密二维码进入本页面。");
  payload = parsePayload();
} catch (e) {
  errorBox.textContent = e.message;
  form.querySelector("button").disabled = true;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!payload) return;
  errorBox.textContent = "";
  resultBox.style.display = "none";
  try {
    const value = await decrypt(payload, document.getElementById("password").value);
    resultBox.textContent = value;
    resultBox.style.display = "block";
  } catch (_) {
    errorBox.textContent = "密码错误，或者二维码数据已损坏。请检查密码后重试。";
  }
});
</script>
</body>
</html>
